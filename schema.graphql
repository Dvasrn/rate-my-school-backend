scalar Date

type Query {
  getAchievementsBySchool(schoolId: ID!): [achievement!]!
  getAllRating: [rating!]!
  getAllReports: [report!]!
  getAllSchool: [School!]!
  getAllUser: [user!]!
  getAnswersByQuestion(questionId: ID!): [schoolAnswer!]!
  getOneTeacher(id: ID!): teacher!
  getOneUser(id: ID!): user!
  getQuestionsBySchool(schoolId: ID!): [schoolQuestion!]!
  getSchoolsRating(schoolId: ID!): [rating!]!
  getTeacherRatings(teacherId: ID!): [teacherRating!]!
  getTeachersBySchool(schoolId: ID!): [teacher!]!
  getUserRating(id: ID!): [rating!]!
}

type Mutation {
  acceptAnswer(input: acceptAnswerInput!): schoolQuestion!
  addAchievement(input: addAchievementInput!): achievement!
  addAnswer(input: addAnswerInput!): schoolAnswer!
  addQuestion(input: addQuestionInput!): schoolQuestion!
  addRating(input: ratingInput!): rating!
  addSchool(input: schoolInfoInput!): School!
  addSchoolPhoto(input: addSchoolPhotoInput!): School!
  addTeacher(input: addTeacherInput!): teacher!
  addTeacherRating(input: teacherRatingInput!): teacherRating!
  choosingSchool(input: choosingSchoolInput!): user!
  deleteAchievement(input: deleteAchievementInput!): achievement!
  deleteRating(_id: ID!): rating!
  deleteSchool(input: deleteSchoolInput!): School!
  deleteUser(input: deleteUserInput!): user!
  editRating(input: ratingInput!): rating!
  editUser(input: editUserInput!): user!
  login(input: loginInput!): user!
  removeSchoolPhoto(input: removeSchoolPhotoInput!): School!
  signIn(input: userInput!): user!
  reportRating(input: reportRatingInput!): report!
  resolveReport(input: resolveReportInput!): report!
  toggleAnswerUpvote(input: toggleAnswerUpvoteInput!): schoolAnswer!
  toggleFavoriteSchool(input: toggleFavoriteInput!): user!
  updateAdmissionInfo(input: updateAdmissionInfoInput!): School!
  updateSchoolFees(input: updateSchoolFeesInput!): School!
  updateSchoolInfo(input: updateSchoolInfoInput!): School!
}

input resolveReportInput {
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  adminUserId: ID
  deleteRating: Boolean!
  reportId: ID!
}

enum ReportReason {
  Fake
  Spam
}

type report {
  _id: ID!
  createdAt: String!
  ratingId: String!
  reason: ReportReason!
  userId: String!
}

input reportRatingInput {
  ratingId: String!
  reason: ReportReason!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

type School {
  _id: ID!
  admissionDeadline: String!
  admissionExam: String!
  admissionMaterials: String!
  admissionThreshold: String!
  dormFee: Int!
  hasScholarship: Boolean!
  isSchoolPrivate: Boolean!
  location: String!
  photos: [String!]!
  schoolName: String!
  schoolType: SchoolType!
  scholarshipInfo: String!
  semesterFee: Int!
}

input updateSchoolFeesInput {
  dormFee: Int!
  hasScholarship: Boolean!
  schoolId: ID!
  scholarshipInfo: String!
  semesterFee: Int!
}

input updateSchoolInfoInput {
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  adminUserId: ID
  isSchoolPrivate: Boolean!
  location: String!
  schoolId: ID!
  schoolName: String!
  schoolType: SchoolType!
}

input updateAdmissionInfoInput {
  admissionDeadline: String!
  admissionExam: String!
  admissionMaterials: String!
  admissionThreshold: String!
  schoolId: ID!
}

enum SchoolType {
  Collage
  HighSchool
  University
}

# Нууц үгийн hash-ийг клиент рүү огт гаргахгүй — login/signIn нь input-аар
# хүлээж авдаг тул унших талбар шаардлагагүй.
type user {
  _id: ID!
  birthDate: String!
  favoriteSchoolIds: [String!]!
  isAdmin: Boolean!
  phoneNumber: Int!
  schools: [usersSchool]
  username: String!
  # Зөвхөн login / signIn хариунд дүүрнэ. Клиент үүнийг хадгалаад дараагийн
  # хүсэлт бүрд `Authorization: Bearer <token>` толгойгоор илгээнэ.
  token: String
}

type usersSchool {
  enrolledAt: String!
  graduated: Boolean!
  graduatedAt: String!
  schoolId: String!
}

type rating {
  _id: ID!
  comment: String!
  createdAt: String!
  schoolId: String!
  scores: scores!
  userId: String!
}

type scores {
  activetyOutsideOfSchool: Int!
  dorm: Int!
  food: Int!
  location: Int!
  reputation: Int!
  sportHall: Int!
  teachers: Int!
}

input ratingInput {
  comment: String!
  schoolId: String!
  scores: scoresInput!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

input scoresInput {
  activetyOutsideOfSchool: Int!
  dorm: Int!
  food: Int!
  location: Int!
  reputation: Int!
  sportHall: Int!
  teachers: Int!
}

input schoolInfoInput {
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  adminUserId: ID
  isSchoolPrivate: Boolean!
  location: String!
  schoolName: String!
  schoolType: SchoolType
}

type teacher {
  _id: ID!
  name: String!
  schoolId: String!
  subject: String!
}

type teacherRating {
  _id: ID!
  comment: String!
  scores: teacherScores!
  teacherId: String!
  userId: String!
}

type teacherScores {
  communication: Int!
  examDifficulty: Int!
  teachingMethod: Int!
}

input addTeacherInput {
  name: String!
  schoolId: String!
  subject: String!
}

input teacherRatingInput {
  comment: String!
  scores: teacherScoresInput!
  teacherId: String!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

input teacherScoresInput {
  communication: Int!
  examDifficulty: Int!
  teachingMethod: Int!
}

input addSchoolPhotoInput {
  photoBase64: String!
  schoolId: ID!
}

input removeSchoolPhotoInput {
  photoIndex: Int!
  schoolId: ID!
}

input toggleFavoriteInput {
  schoolId: ID!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: ID
}

input choosingSchoolInput {
  enrolledAt: String!
  graduated: Boolean!
  graduatedAt: String
  schoolId: String!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

input editUserInput {
  phoneNumber: Int!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: ID
  username: String!
}

input deleteSchoolInput {
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  adminUserId: ID
  schoolId: ID!
}

input deleteUserInput {
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  adminUserId: ID
  userId: ID!
}

input loginInput {
  password: String!
  phoneNumber: Int!
}

input userInput {
  birthDate: String
  password: String!
  phoneNumber: Int!
  username: String!
}

type schoolQuestion {
  _id: ID!
  acceptedAnswerId: String
  createdAt: String!
  schoolId: String!
  text: String!
  userId: String!
}

type schoolAnswer {
  _id: ID!
  createdAt: String!
  questionId: String!
  text: String!
  upvotedBy: [String!]!
  userId: String!
}

input addQuestionInput {
  schoolId: String!
  text: String!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

input addAnswerInput {
  questionId: String!
  text: String!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
}

input toggleAnswerUpvoteInput {
  answerId: ID!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: ID
}

input acceptAnswerInput {
  answerId: ID!
  questionId: ID!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: ID
}

enum AchievementCategory {
  Hackathon
  ICPC
  NBAA
  Olympiad
}

type achievement {
  _id: ID!
  category: AchievementCategory!
  createdAt: String!
  description: String!
  schoolId: String!
  title: String!
  userId: String!
  year: Int!
}

input addAchievementInput {
  category: AchievementCategory!
  description: String!
  schoolId: String!
  title: String!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: String
  year: Int!
}

input deleteAchievementInput {
  achievementId: ID!
  # Серверээс үл хэрэгсэнэ — хэн үйлдэл хийж байгааг токеноос тодорхойлно.
  userId: ID
}
